<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    
    <title>Módulo de Transferencia | Sistema Espacial</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- Motor Gráfico 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            /* Paleta Espacial Profunda */
            --bg-deep: #010409;
            --panel-bg: rgba(6, 18, 43, 0.55);
            --neon-blue: #0088ff;
            --neon-cyan: #00f3ff;
            --text-bright: #e0f8ff;
            --text-dim: #6b8cce;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-bright);
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .hud-container {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 680px; 
            box-shadow: 0 0 40px rgba(0, 136, 255, 0.15), inset 0 0 20px rgba(0, 243, 255, 0.05);
            position: relative;
            z-index: 10;
        }

        .hud-container::before, .hud-container::after {
            content: ''; position: absolute; width: 30px; height: 30px; 
            border: 2px solid var(--neon-cyan);
            border-radius: 4px;
            pointer-events: none;
        }
        .hud-container::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .hud-container::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }

        h2 {
            text-align: center;
            color: var(--neon-cyan);
            margin: 0 0 30px 0;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            padding-bottom: 15px;
        }

        .control-group { margin-bottom: 30px; }

        .sys-label {
            display: block;
            color: var(--text-dim);
            margin-bottom: 12px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .tabs-container {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 5px;
            background: rgba(0, 136, 255, 0.05);
            border: 1px solid rgba(0, 136, 255, 0.3);
            color: var(--text-dim);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .tab-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }

        .tab-btn.active {
            background: rgba(0, 136, 255, 0.2);
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .data-grid { display: flex; flex-direction: column; gap: 8px; }

        .data-row {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 136, 255, 0.03);
            border-left: 3px solid transparent;
            padding: 14px 16px; border-radius: 6px;
            transition: all 0.3s ease; gap: 15px;
        }

        .data-row:hover {
            background: rgba(0, 136, 255, 0.08);
            border-left: 3px solid var(--neon-cyan);
            transform: translateX(4px);
        }

        .row-info { 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            flex: 1; /* Permite que el texto ocupe el espacio disponible */
            min-width: 0; /* Previene desbordamiento en flexbox */
        }
        
        .row-label { font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        
        .row-value { 
            font-size: 1.1rem; 
            color: var(--text-bright); 
            font-weight: 500; 
            letter-spacing: 0.5px;
            word-break: break-word; /* Crucial para correos largos en celular */
        }
        
        .highlight-value {
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
        }

        .btn-copy {
            background: rgba(0, 136, 255, 0.15);
            color: var(--neon-cyan);
            border: none;
            border-left: 2px solid var(--neon-cyan); border-right: 2px solid var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace; font-weight: 600; font-size: 0.85rem;
            padding: 8px 18px; cursor: pointer; text-transform: uppercase;
            transition: all 0.3s ease; letter-spacing: 1px;
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
            flex-shrink: 0;
        }

        .btn-copy:hover {
            background: var(--neon-cyan); color: var(--bg-deep);
            box-shadow: 0 0 15px var(--neon-cyan); border-color: #fff;
        }

        .btn-copy.copied {
            background: #fff; color: var(--bg-deep); border-color: #fff; box-shadow: 0 0 20px #fff;
        }

        @keyframes decrypt {
            0% { opacity: 0.2; transform: translateY(2px); filter: hue-rotate(90deg); }
            50% { opacity: 0.8; transform: translateY(-1px); filter: hue-rotate(-90deg); }
            100% { opacity: 1; transform: translateY(0); filter: hue-rotate(0deg); }
        }

        .updating .row-value { animation: decrypt 0.4s ease forwards; color: #fff; text-shadow: 0 0 10px #fff; }

        /* ==========================================
           ADAPTACIÓN PARA CELULARES (RESPONSIVE)
           ========================================== */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            .hud-container {
                padding: 25px 15px;
            }
            h2 {
                font-size: 1.3rem;
                margin-bottom: 20px;
            }
            .tab-btn {
                font-size: 0.85rem;
                padding: 10px 5px;
            }
            .data-row {
                padding: 12px 10px;
                gap: 10px;
            }
            .row-value {
                font-size: 0.95rem;
            }
            .highlight-value {
                font-size: 1rem;
            }
            .btn-copy {
                padding: 8px 12px;
                font-size: 0.75rem;
                clip-path: polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%);
            }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- Interfaz Bancaria -->
<div class="hud-container">
    <h2>Datos de Transferencia</h2>
    <div class="control-group">
        <span class="sys-label">/// Agencia Bancaria</span>
        <div class="tabs-container">
            <button id="btn-pacifico" class="tab-btn active" onclick="seleccionarBanco('pacifico')">Banco del Pacífico</button>
            <button id="btn-guayaquil" class="tab-btn" onclick="seleccionarBanco('guayaquil')">Banco de Guayaquil</button>
        </div>
    </div>
    
    <div class="control-group" style="margin-bottom: 0;">
        <span class="sys-label">/// Datos Bancarios</span>
        <div class="data-grid" id="contenedorDatos">
            <div class="data-row">
                <div class="row-info">
                    <span class="row-label">Titular</span>
                    <span class="row-value">Derick Alexander Obregón Santillán</span>
                </div>
            </div>
            <div class="data-row">
                <div class="row-info">
                    <span class="row-label">Tipo</span>
                    <span class="row-value">Ahorro</span>
                </div>
            </div>
            <div class="data-row">
                <div class="row-info">
                    <span class="row-label">N° de Cuenta</span>
                    <span class="row-value highlight-value" id="txtCuenta">Cargando...</span>
                </div>
                <button class="btn-copy" onclick="ejecutarCopia('txtCuenta', this)">Copiar</button>
            </div>
            <div class="data-row">
                <div class="row-info">
                    <span class="row-label">N° de Cédula</span>
                    <span class="row-value highlight-value" id="txtCedula">0950161208</span>
                </div>
                <button class="btn-copy" onclick="ejecutarCopia('txtCedula', this)">Copiar</button>
            </div>
            <div class="data-row">
                <div class="row-info">
                    <span class="row-label">Correo Electrónico</span>
                    <span class="row-value highlight-value" id="txtCorreo">Cargando...</span>
                </div>
                <button class="btn-copy" onclick="ejecutarCopia('txtCorreo', this)">Copiar</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // LÓGICA DE INTERFAZ
    // ==========================================
    const misDatos = {
        cedula: "0950161208",
        cuentas: {
            pacifico: { numero: "1069409390", correo: "yolykarina_3214@hotmail.com" },
            guayaquil: { numero: "0060692160", correo: "derickalexanderobregon874@gmail.com" }
        }
    };

    function seleccionarBanco(bancoSeleccionado) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + bancoSeleccionado).classList.add('active');

        const grid = document.getElementById('contenedorDatos');
        const banco = misDatos.cuentas[bancoSeleccionado];
        
        grid.classList.remove('updating');
        void grid.offsetWidth; 
        grid.classList.add('updating');

        document.getElementById('txtCuenta').innerText = banco.numero;
        document.getElementById('txtCorreo').innerText = banco.correo;
        
        setTimeout(() => { grid.classList.remove('updating'); }, 400); 
    }

    function ejecutarCopia(idElemento, boton) {
        const textoACopiar = document.getElementById(idElemento).innerText;
        navigator.clipboard.writeText(textoACopiar).then(() => {
            const textoOriginal = boton.innerText;
            boton.innerText = "COPIADO";
            boton.classList.add('copied');
            setTimeout(() => {
                boton.innerText = textoOriginal;
                boton.classList.remove('copied');
            }, 1500);
        });
    }

    window.onload = () => seleccionarBanco('pacifico');


    // ==========================================
    // MOTOR GRÁFICO 3D (ESPACIO, ASTEROIDES Y 2 ROBOTS)
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x010409, 0.015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 25);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.physicallyCorrectLights = true;
    container.appendChild(renderer.domElement);

    // Iluminación
    const ambientLight = new THREE.AmbientLight(0xffffff, 2);
    scene.add(ambientLight);
    
    const mainLight = new THREE.DirectionalLight(0xffffff, 4);
    mainLight.position.set(10, 20, 15);
    scene.add(mainLight);

    const rimLight = new THREE.DirectionalLight(0x00f3ff, 2.5);
    rimLight.position.set(-15, 10, -10);
    scene.add(rimLight);

    // --- SISTEMA DE ESTRELLAS ---
    const starGeo = new THREE.BufferGeometry();
    const starCount = 1500;
    const starPos = new Float32Array(starCount * 3);
    for(let i = 0; i < starCount * 3; i++) {
        starPos[i] = (Math.random() - 0.5) * 300; 
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.8 });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // --- CAMPO DE ASTEROIDES ---
    const asteroids = [];
    const astMat = new THREE.MeshStandardMaterial({
        color: 0x444855,
        roughness: 0.9,
        metalness: 0.1,
        flatShading: true 
    });

    for(let i = 0; i < 40; i++) {
        const size = Math.random() * 2 + 0.5;
        const astGeo = new THREE.DodecahedronGeometry(size, 0); 
        const ast = new THREE.Mesh(astGeo, astMat);
        
        ast.scale.set(1 + Math.random()*0.5, 1 + Math.random()*0.5, 1 + Math.random()*0.5);
        
        ast.position.set(
            (Math.random() - 0.5) * 120, 
            (Math.random() - 0.5) * 80, 
            -15 - Math.random() * 80
        );

        ast.userData = {
            rotX: (Math.random() - 0.5) * 0.01,
            rotY: (Math.random() - 0.5) * 0.01,
            rotZ: (Math.random() - 0.5) * 0.01,
            floatSpeed: (Math.random() - 0.5) * 0.01,
            offsetY: Math.random() * Math.PI * 2
        };
        scene.add(ast);
        asteroids.push(ast);
    }

    // --- CONSTRUCTOR DE ROBOTS ---
    const matPlastic = new THREE.MeshPhysicalMaterial({ 
        color: 0xffffff, roughness: 0.2, metalness: 0.1, clearcoat: 1.0, clearcoatRoughness: 0.1 
    });
    const matScreen = new THREE.MeshPhysicalMaterial({ 
        color: 0x050508, roughness: 0.1, metalness: 0.6, clearcoat: 1.0 
    });
    const matEar = new THREE.MeshPhysicalMaterial({ color: 0x8899a6, roughness: 0.4, metalness: 0.3 });
    const matNeon = new THREE.MeshBasicMaterial({ color: 0x00f3ff });

    function createPremiumBot() {
        const bot = new THREE.Group();

        const headGroup = new THREE.Group();
        headGroup.position.y = 1.6;
        bot.add(headGroup);

        const headGeo = new THREE.SphereGeometry(1, 64, 64);
        const head = new THREE.Mesh(headGeo, matPlastic);
        head.scale.set(1.4, 0.95, 1);
        headGroup.add(head);

        const earGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.2, 32);
        const earL = new THREE.Mesh(earGeo, matEar);
        earL.rotation.z = Math.PI / 2;
        earL.position.set(-1.45, 0, 0);
        headGroup.add(earL);

        const earR = new THREE.Mesh(earGeo, matEar);
        earR.rotation.z = Math.PI / 2;
        earR.position.set(1.45, 0, 0);
        headGroup.add(earR);

        const screenGeo = new THREE.SphereGeometry(0.95, 64, 64);
        const screen = new THREE.Mesh(screenGeo, matScreen);
        screen.scale.set(1.3, 0.75, 0.95);
        screen.position.z = 0.1;
        headGroup.add(screen);

        const eyeGeo = new THREE.TorusGeometry(0.18, 0.06, 16, 32, Math.PI);
        const eyeL = new THREE.Mesh(eyeGeo, matNeon);
        eyeL.position.set(-0.45, 0.05, 1.02);
        headGroup.add(eyeL);

        const eyeR = new THREE.Mesh(eyeGeo, matNeon);
        eyeR.position.set(0.45, 0.05, 1.02);
        headGroup.add(eyeR);

        const mouthGeo = new THREE.TorusGeometry(0.12, 0.04, 16, 32, Math.PI);
        const mouth = new THREE.Mesh(mouthGeo, matNeon);
        mouth.position.set(0, -0.2, 1.01);
        mouth.rotation.z = Math.PI; 
        headGroup.add(mouth);

        const bodyGeo = new THREE.SphereGeometry(1, 64, 64);
        const body = new THREE.Mesh(bodyGeo, matPlastic);
        body.scale.set(1.2, 1.4, 1);
        body.position.y = -0.5;
        bot.add(body);

        const armGeo = new THREE.SphereGeometry(0.3, 32, 32);
        
        const armPivotL = new THREE.Group();
        armPivotL.position.set(-1.4, 0.4, 0);
        const armL = new THREE.Mesh(armGeo, matPlastic);
        armL.scale.set(1, 2.5, 1);
        armL.position.y = -0.7;
        armPivotL.add(armL);
        bot.add(armPivotL);

        const armPivotR = new THREE.Group();
        armPivotR.position.set(1.4, 0.4, 0);
        const armR = new THREE.Mesh(armGeo, matPlastic);
        armR.scale.set(1, 2.5, 1);
        armR.position.y = -0.7;
        armPivotR.add(armR);
        bot.add(armPivotR);

        return { 
            group: bot, head: headGroup, armL: armPivotL, armR: armPivotR, 
            baseY: 0, baseRotY: 0, spinTimer: Math.random() * 10
        };
    }

    const bots = [];
    const positions = [
        { x: -16, y: -1, z: 2, rot: Math.PI / 6, scale: 1 }, 
        { x: 16, y: -2, z: 4, rot: -Math.PI / 6, scale: 1.15 } 
    ];

    for (let i = 0; i < 2; i++) {
        const b = createPremiumBot();
        b.group.position.set(positions[i].x, positions[i].y, positions[i].z);
        b.group.rotation.y = positions[i].rot;
        b.group.scale.setScalar(positions[i].scale);
        b.baseY = positions[i].y;
        b.baseRotY = positions[i].rot;
        scene.add(b.group);
        bots.push(b);
    }

    // Función para ocultar robots en celular
    function gestionarVisibilidadRobots() {
        const esCelular = window.innerWidth <= 768;
        bots.forEach(b => {
            b.group.visible = !esCelular;
        });
    }
    
    // Ejecutar al inicio
    gestionarVisibilidadRobots();

    // Adaptabilidad de ventana
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        // Verificar si se deben ocultar o mostrar los robots al cambiar el tamaño
        gestionarVisibilidadRobots();
    });

    // Tracking del Mouse / Toque
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });
    
    // Para celulares (Parallax suave al tocar)
    document.addEventListener('touchmove', (e) => {
        if(e.touches.length > 0) {
            mouseX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
        }
    }, {passive: true});

    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();
        const delta = clock.getDelta() || 0.016;

        camera.position.x += (mouseX * 2 - camera.position.x) * 0.05;
        camera.position.y += (mouseY * 1.5 - camera.position.y) * 0.05;
        camera.lookAt(0, 0, 0);

        stars.rotation.y += 0.0005;
        stars.rotation.x += 0.0002;

        asteroids.forEach(ast => {
            ast.rotation.x += ast.userData.rotX;
            ast.rotation.y += ast.userData.rotY;
            ast.rotation.z += ast.userData.rotZ;
            ast.position.y += Math.sin(time + ast.userData.offsetY) * ast.userData.floatSpeed;
        });

        const targetX = mouseX * 25;
        const targetY = mouseY * 15;

        // Solo animar robots si están visibles
        bots.forEach((b, index) => {
            if (!b.group.visible) return;

            b.group.position.y = b.baseY + Math.sin(time * 2 + index) * 0.4;
            b.armL.rotation.x = Math.sin(time * 3 + index) * 0.2;
            b.armR.rotation.x = Math.sin(time * 3 + index + Math.PI) * 0.2;

            const lookTarget = new THREE.Vector3(targetX, targetY + b.baseY, 20);
            const targetRotation = b.head.clone();
            targetRotation.lookAt(lookTarget);
            b.head.quaternion.slerp(targetRotation.quaternion, 0.08);

            b.spinTimer -= delta;
            if (b.spinTimer <= 0) {
                b.group.rotation.y += 0.15;
                b.armL.rotation.z = Math.PI / 4;
                b.armR.rotation.z = -Math.PI / 4;

                if (b.group.rotation.y > b.baseRotY + Math.PI * 2) {
                    b.group.rotation.y = b.baseRotY; 
                    b.spinTimer = 8 + Math.random() * 10; 
                    b.armL.rotation.z = 0;
                    b.armR.rotation.z = 0;
                }
            } else {
                b.group.rotation.y += (b.baseRotY - b.group.rotation.y) * 0.05;
                b.armL.rotation.z += (0 - b.armL.rotation.z) * 0.1;
                b.armR.rotation.z += (0 - b.armR.rotation.z) * 0.1;
            }
        });

        renderer.render(scene, camera);
    }
    animate();
</script>

</body>
</html>
